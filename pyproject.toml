[project]
name = "prt661"
version = "4.0.0"
description = "NSW suburb house-price forecasting pipeline (PRT661 Sydn2-Theme2)"
requires-python = ">=3.10"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
